---
# Archived workflow.
#
# This MkDocs-based GitHub Pages deployment has been retired in favor of
# `.github/workflows/deploy-widoco.yaml`.
#
# GitHub Actions only runs workflows located directly in `.github/workflows/`;
# keeping this file in the `archive/` subdirectory preserves it as historical
# documentation without allowing it to trigger.
name: Auto-deployment of PEH-model Documentation
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-docs:
    runs-on: ubuntu-latest

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      contents: write  # to let mkdocs write the new docs
      pages: write     # to deploy to Pages
      id-token: write  # to verify the deployment originates from an appropriate source

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0  # otherwise, you will failed to push refs to dest repo

      - name: Set up Python.
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies.
        run: pip install -e ".[docs]"

      - name: Build documentation.
        run: |
          mkdir -p docs
          touch docs/.nojekyll
          gen-doc -d docs linkml/schema/peh.yaml
          cp README.md docs/about.md
          mkdocs gh-deploy
