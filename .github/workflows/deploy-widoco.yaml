---
name: Deploy WIDOCO Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-widoco.yaml'
      - 'Makefile'
      - 'docker-compose.widoco.yml'
      - 'linkml/docs/**'
      - 'linkml/schema/**'
      - 'linkml/scripts/build_widoco_focus.py'
      - 'linkml/scripts/postprocess_widoco_html.py'
      - 'linkml/scripts/validate_widoco_focus.py'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: widoco-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e ".[docs]"

      - name: Build WIDOCO site
        run: make widoco-docs

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/widoco

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
